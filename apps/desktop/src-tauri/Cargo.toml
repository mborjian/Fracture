[package]
name = "fracture-desktop"
version = "1.0.0"
description = "Fracture desktop shell"
authors = ["Fracture"]
edition = "2021"

[lib]
name = "fracture_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.6", features = ["tray-icon"] }
tokio = { version = "1", features = ["process", "sync"] }
once_cell = "1.20"
winreg = "0.52"
ureq = { version = "2.10", features = ["json"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
