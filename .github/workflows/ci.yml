name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.x
  PYTHON_VERSION: '3.12'
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUTF8: '1'
  PYTHONHASHSEED: '0'

jobs:
  windows:
    name: Windows Validation
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Configure npm registry and update
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          npm config set registry https://registry.npmjs.org/
          npm install -g npm@latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Set up Rust toolchain
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry\cache
            ~\.cargo\registry\index
            ~\.cargo\git\db
            apps\desktop\src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Detect optional lint and test commands
        id: detect
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $rootPackage = Get-Content package.json | ConvertFrom-Json
          $desktopPackage = Get-Content apps/desktop/package.json | ConvertFrom-Json

          $rootScriptNames = @()
          if ($null -ne $rootPackage.scripts) {
            $rootScriptNames = @($rootPackage.scripts.PSObject.Properties.Name)
          }

          $desktopScriptNames = @()
          if ($null -ne $desktopPackage.scripts) {
            $desktopScriptNames = @($desktopPackage.scripts.PSObject.Properties.Name)
          }

          $pythonTests = @(Get-ChildItem -Path apps/backend -Recurse -File | Where-Object {
            $_.FullName -match '\\tests\\' -or
            $_.Name -match '^test_.*\.py$' -or
            $_.Name -match '.*_test\.py$' -or
            $_.Name -match '.*\.test\.py$' -or
            $_.Name -match '.*\.spec\.py$'
          })

          "backend_lint=$($rootScriptNames -contains 'backend:lint')" >> $env:GITHUB_OUTPUT
          "desktop_test_script=$($desktopScriptNames -contains 'test')" >> $env:GITHUB_OUTPUT
          "python_tests=$($pythonTests.Count -gt 0)" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          npm --prefix apps/desktop ci

      - name: Install backend dependencies
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt

      - name: Install backend lint dependency
        if: steps.detect.outputs.backend_lint == 'True'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python -m pip install ruff

      - name: Run configured lint checks
        if: steps.detect.outputs.backend_lint == 'True'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          npm run backend:lint

      - name: Run frontend tests when configured
        if: steps.detect.outputs.desktop_test_script == 'True'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          npm --prefix apps/desktop test

      - name: Run backend tests when present
        if: steps.detect.outputs.python_tests == 'True'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python -m pip install pytest
          python -m pytest apps/backend

      - name: Report missing automated tests
        if: steps.detect.outputs.desktop_test_script != 'True' && steps.detect.outputs.python_tests != 'True'
        run: |
          Write-Host 'No frontend or backend test suites are configured yet.'

      - name: Build frontend
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          npm run desktop:build

      - name: Verify backend imports on Windows
        working-directory: apps/backend
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python -c "import app.main"

      - name: Build packaged backend executable
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/backend/scripts/build-backend.ps1 -PythonExe python

      - name: Run Tauri integration build without bundling
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # The CI-only Tauri config keeps validation fast by skipping the
          # normal frontend rebuild and the installer bundling phase.
          npm --prefix apps/desktop run tauri:build:ci

      - name: Upload CI build outputs
        uses: actions/upload-artifact@v4
        with:
          name: fracture-ci-windows-build
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/backend/dist/fracture-backend.exe
            apps/desktop/src-tauri/target/debug/fracture-desktop.exe
